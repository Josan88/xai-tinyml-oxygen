; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nano33ble

[env:nano33ble]
platform = nordicnrf52
board = nano33ble
framework = arduino
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
    arduino-libraries/ArduinoBLE@^1.3.6
monitor_speed = 115200

; Explicit diagnostic build: replay supplied windows over USB, no sensor/BLE.
[env:nano33ble_parity]
extends = env:nano33ble
build_flags = -DPARITY_REPLAY_BUILD
build_src_filter = -<*> +<parity_replay.cpp>

; Streaming diagnostic exercises the deployment delay, XAI and debounce state.
[env:nano33ble_context_parity]
extends = env:nano33ble
build_flags = -DCONTEXT_PARITY_BUILD
build_src_filter = -<*> +<context_parity_replay.cpp>

; Explicit compute-timing build. No sensor/BLE and no ATTR14 recomputation.
[env:nano33ble_context_timing]
extends = env:nano33ble
build_flags = -DCONTEXT_TIMING_BUILD
build_src_filter = -<*> +<context_timing_replay.cpp>

; v2 model (ADR-0006): 16-input TinyKAN on paired IR/red samples, kan_model_weights_v2.h.
; Never the default; name the env explicitly. The envs above stay v1.
[env:nano33ble_v2]
extends = env:nano33ble
build_flags = -DOXY_MODEL_V2

; Diagnostic variant of the live v2 image (sensor + BLE): same loop, plus LT:/LT_IDLE:
; timing lines per decision. Not the shipped image. See outputs/firmware-v2-looptiming/.
[env:nano33ble_v2_looptiming]
extends = env:nano33ble_v2
build_flags = ${env:nano33ble_v2.build_flags} -DLOOP_TIMING_V2

; Second diagnostic: as nano33ble_v2_looptiming, plus LT2: decision sub-phases and a 4 kHz
; TIMER4 context sampler during the decision block. Not the shipped image.
; See outputs/firmware-v2-looptiming2/.
[env:nano33ble_v2_looptiming2]
extends = env:nano33ble_v2
build_flags = ${env:nano33ble_v2.build_flags} -DLOOP_TIMING_V2 -DLOOP_TIMING_V2_PHASES

; F1a diagnostic: as nano33ble_v2_looptiming2, plus the loop thread raised to
; osPriorityAboveNormal only around the deciding push_sample (FINDINGS addendum A5).
; Not the shipped image. See outputs/firmware-v2-looptiming3/.
[env:nano33ble_v2_looptiming3]
extends = env:nano33ble_v2
build_flags = ${env:nano33ble_v2.build_flags} -DLOOP_TIMING_V2 -DLOOP_TIMING_V2_PHASES -DLOOP_PRIORITY_V2

; Shipped-style v2 live image with the F1a priority bracket (LOOP_PRIORITY_V2 only, no
; timing flags); not yet flashed. See outputs/firmware-v2-f1a/.
[env:nano33ble_v2_f1a]
extends = env:nano33ble_v2
build_flags = ${env:nano33ble_v2.build_flags} -DLOOP_PRIORITY_V2

; SpO2 est from the Maxim reference algorithm (ADR-0010): the shipped-style f1a image plus
; -DOXY_SPO2_MAXIM. Display only; TinyKAN, alert and explanation unchanged. Not the paper's
; image (that is f1a-r2, cdefac1d). See outputs/firmware-v2-f1a-spo2maxim/.
[env:nano33ble_v2_f1a_spo2]
extends = env:nano33ble_v2_f1a
build_flags = ${env:nano33ble_v2_f1a.build_flags} -DOXY_SPO2_MAXIM

; LED1 identity diagnostic: exactly the looptiming3 flags plus a one-off check in setup()
; that turns LED1 (reg 0x0C) off for 60 s, to show which labeled channel is LED1.
; Not the shipped image. See outputs/firmware-v2-led1check/.
[env:nano33ble_v2_led1check]
extends = env:nano33ble_v2
build_flags = ${env:nano33ble_v2.build_flags} -DLOOP_TIMING_V2 -DLOOP_TIMING_V2_PHASES -DLOOP_PRIORITY_V2 -DLED1_IDENTITY_CHECK

; Peak-RAM probes of the two live images (docs/peak-ram-design.md): the live env plus
; -DPEAK_RAM_PROBE (RAM paint/scan, PR:/PR_INFO: lines, forced decisions with no
; finger) and a linker map. Not shipped images. See outputs/firmware-peakram-prepared/.
[env:nano33ble_peakram]
extends = env:nano33ble
build_flags = -DPEAK_RAM_PROBE -Wl,-Map,.pio/build/nano33ble_peakram/firmware.map

[env:nano33ble_v2_f1a_peakram]
extends = env:nano33ble_v2_f1a
build_flags = ${env:nano33ble_v2_f1a.build_flags} -DPEAK_RAM_PROBE -Wl,-Map,.pio/build/nano33ble_v2_f1a_peakram/firmware.map

; Peak-RAM sampler probes (docs/peak-ram-design.md section 8): the two probe envs above plus
; -DPEAK_RAM_LIVE_GATE (finger gate and BLE payload as shipped; no forced decisions) and
; -DPEAK_RAM_SAMPLER (TIMER4 4 kHz instantaneous-total sampler: samp_max, s_win). For a finger-on,
; dashboard-connected run. Not shipped images. See outputs/firmware-peakram-sampler-prepared/.
[env:nano33ble_peakram_sampler]
extends = env:nano33ble_peakram
build_flags = -DPEAK_RAM_PROBE -DPEAK_RAM_LIVE_GATE -DPEAK_RAM_SAMPLER -Wl,-Map,.pio/build/nano33ble_peakram_sampler/firmware.map

[env:nano33ble_v2_f1a_peakram_sampler]
extends = env:nano33ble_v2_f1a_peakram
build_flags = ${env:nano33ble_v2_f1a.build_flags} -DPEAK_RAM_PROBE -DPEAK_RAM_LIVE_GATE -DPEAK_RAM_SAMPLER -Wl,-Map,.pio/build/nano33ble_v2_f1a_peakram_sampler/firmware.map

; v2 streaming diagnostic: B blocks carry 250 IR/red pairs; A returns all 16 deltas.
[env:nano33ble_v2_context_parity]
extends = env:nano33ble
build_flags = -DOXY_MODEL_V2 -DCONTEXT_PARITY_V2_BUILD
build_src_filter = -<*> +<context_parity_replay_v2.cpp>

; v2 compute-timing build. No sensor/BLE and no ATTR16 recomputation.
[env:nano33ble_v2_context_timing]
extends = env:nano33ble
build_flags = -DOXY_MODEL_V2 -DCONTEXT_TIMING_V2_BUILD
build_src_filter = -<*> +<context_timing_replay_v2.cpp>

; Label-0-median explainer reference (docs/xai-reference-label0-runbook.md): each XAI pass sets
; the input to KAN_XAI_REF_Z[i] (kan_xai_reference_v2.h) instead of 0. Not the shipped images;
; nothing above changes. See outputs/firmware-v2-ref0/.
; Live: exactly the nano33ble_v2_f1a flags plus the reference flag; BLE fields 10-11.
[env:nano33ble_v2_f1a_ref0]
extends = env:nano33ble_v2_f1a
build_flags = ${env:nano33ble_v2_f1a.build_flags} -DOXY_XAI_REF_LABEL0

; v2 context parity plus the reference flag; H answers the v2 identity + " XAI_REF=LABEL0".
[env:nano33ble_v2_context_parity_ref0]
extends = env:nano33ble_v2_context_parity
build_flags = ${env:nano33ble_v2_context_parity.build_flags} -DOXY_XAI_REF_LABEL0

; P5 model (job F2, ADR-0008): 5 beat inputs (include/physio_features.h) on the v2 paired IR/red
; context filter, TinyKAN P5 (kan_model_weights_p5.h), label-0-median explainer reference
; (kan_xai_reference_p5.h), and the s_hat concept regressor (kan_sat_regressor_p5.h; display only).
; A third model beside v1 and v2; never the default, nothing above changes. See outputs/firmware-p5/.
; Live: sensor + BLE + the F1a priority bracket, the sensor settings of nano33ble_v2_f1a; BLE fields 10-11.
[env:nano33ble_p5_f1a]
extends = env:nano33ble
build_flags = -DOXY_MODEL_P5 -DOXY_XAI_REF_LABEL0 -DLOOP_PRIORITY_V2

; P5 streaming diagnostic: B blocks carry 250 IR/red pairs; RESULT carries the five inputs,
; n_beats, beat_valid, s_hat and all five deltas. H answers CONTEXT_PARITY_P5 ... XAI_REF=LABEL0.
[env:nano33ble_p5_context_parity]
extends = env:nano33ble
build_flags = -DOXY_MODEL_P5 -DOXY_XAI_REF_LABEL0 -DCONTEXT_PARITY_P5_BUILD
build_src_filter = -<*> +<context_parity_replay_p5.cpp>

; P5 compute-timing build (D2 GPIO pulse, DWT cycles). No sensor/BLE, no recomputed deltas.
[env:nano33ble_p5_context_timing]
extends = env:nano33ble
build_flags = -DOXY_MODEL_P5 -DOXY_XAI_REF_LABEL0 -DCONTEXT_TIMING_P5_BUILD
build_src_filter = -<*> +<context_timing_replay_p5.cpp>
